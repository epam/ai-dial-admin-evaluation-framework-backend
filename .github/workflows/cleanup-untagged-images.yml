name: Cleanup untagged images

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  clean:
    name: Delete untagged images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          # Defaults to only the package matching the repo name - the eval-cli image
          # (ghcr.io/epam/eval-cli) is a separate, top-level GHCR package (not nested under
          # this repo) and must be listed explicitly or its untagged layers never get swept.
          packages: ai-dial-admin-evaluation-framework-backend,eval-cli