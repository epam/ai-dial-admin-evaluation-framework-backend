include:
  - local: Security-Scanning.gitlab-ci.yml

services:
  - name: docker:23.0.6-dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  ### HELM-related variables ###
  HELM_PRIVATE_REPO: "false"
  HELM_REPO: https://charts.epam-rail.com
  CHART: "dial-extension"
  VERSION: "1.0.4"

  ARM_TENANT_ID: "b41b72d0-4e9f-4c26-8a69-f949f367c91d"
  AZURE_DEFAULTS_GROUP: "epm-rtc"
  CLUSTER_NAME: "aks-imfeid-demo-001"
  NAMESPACE: "ai-dial-test"

  ### Docker-related variables ###

  DOCKER_PATH: "dial-admin-evaluation/images/dial-admin-evaluation-framework-backend"
  DOCKERFILE_PATH: "."
  DOCKER_OS: linux
  DOCKER_ADDITIONAL_TAG: ""
  DOCKER_BUILD_ARGS: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""


stages:
  - test
  - build
  - security-scanning
  - scanning-reports-validation
  - tag
  - publish # publush docker images
  - deploy
  - production #not used
  - promote

build:
  stage: build
  image: gradle:9.5.1-jdk25
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - chmod +x gradlew
    - groupadd docker
    - whoami
    - usermod -aG docker root
    - gpasswd -a root docker
    - ls
    - curl -fsSL https://app.testcontainers.cloud/bash | bash
  script: ./gradlew build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
  tags:
    - DockerExecutor
    - Linux
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'development'"
    - if: "$CI_COMMIT_TAG"

tag_branch:
  image: alpine/git:v2.32.0
  stage: tag
  script:
    - ver=$(git describe --abbrev=0 --tags | cut -f-2 -d '.') || ver=0.0
    - minor_tag=$(git describe --abbrev=0 --tags | cut -f 3 -d '.') || minor_tag=0
    - release_tag=${ver}.$(( minor_tag+1 ))
    - git remote set-url origin https://$GITLAB_ROBOT_NAME:$GITLAB_ROBOT_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git
    - git config user.name $GITLAB_ROBOT_NAME
    - git config user.email ${GITLAB_ROBOT_EMAIL}
    - git diff --quiet && git diff --staged --quiet || git commit -am "RobotBuild ${release_tag}"
    - git tag ${release_tag}
    - git push origin HEAD:${CI_COMMIT_REF_NAME} --tags
  dependencies: []
  rules:
    - if: "$CI_COMMIT_REF_SLUG =~ /^release-/ && $CI_COMMIT_MESSAGE !~ /^RobotBuild/"
  tags:
    - kubernetes

### Copy docker images to public repository. Run on git tag manually
promote:
  image: dockerhub.deltixhub.com/curlimages/curl:7.88.1
  stage: promote
  variables:
    GIT_STRATEGY: none
  script:
    - |
      curl --retry 6 --retry-all-errors --no-progress-meter --fail -X POST "${ARTIFACTORY_URL}/api/docker/${ARTIFACTORY_DEV_DOCKER_REPO}/v2/promote" -H "Content-Type: application/json" -u${ARTIFACTORY_USER}:${ARTIFACTORY_PASS} -d '{ "targetRepo": '\"${ARTIFACTORY_PROD_DOCKER_REPO}\"', "dockerRepository": '\"${DOCKER_PATH}\"', "tag" : '\"$CI_COMMIT_TAG\"', "copy": true }'
    - >
      if [ ! -z "$DOCKER_ADDITIONAL_TAG" ]; then
        curl --retry 6 --retry-all-errors --no-progress-meter --fail -X POST "${ARTIFACTORY_URL}/api/docker/${ARTIFACTORY_DEV_DOCKER_REPO}/v2/promote" -H "Content-Type: application/json" -u${ARTIFACTORY_USER}:${ARTIFACTORY_PASS} -d '{ "targetRepo": '\"${ARTIFACTORY_PROD_DOCKER_REPO}\"', "dockerRepository": '\"${DOCKER_PATH}\"', "tag" : '\"$DOCKER_ADDITIONAL_TAG\"', "copy": true }'
      fi
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      variables:
        DOCKER_ADDITIONAL_TAG: latest
  tags:
    - AWS
    - DockerExecutor

publish:
  image: dockerhub.deltixhub.com/docker:23.0.6
  stage: publish
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  cache: {}
  services:
    - docker:23.0.6-dind
  before_script:
    - mkdir -p $HOME/.docker
    # Use DOCKER_AUTH_CONFIG for login to deltix repo
    - echo $DOCKER_AUTH_CONFIG > $HOME/.docker/config.json
  script:
    - imageUrl=$REPOSITORY/${DOCKER_PATH}
    - docker build -t $imageUrl:${DOCKER_TAG} -t $imageUrl:${DOCKER_ADDITIONAL_TAG} .
    - "docker image ls $imageUrl:${DOCKER_TAG} --format 'Image size (tag {{.Tag}}): {{.Size}}'"
    - docker push $imageUrl:${DOCKER_TAG}
    - docker push $imageUrl:${DOCKER_ADDITIONAL_TAG}
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        DOCKER_TAG: ${CI_COMMIT_TAG}
        DOCKER_ADDITIONAL_TAG: latest
        REPOSITORY: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}
    - if: $CI_COMMIT_BRANCH  == "development"
      variables:
        DOCKER_TAG: ${CI_COMMIT_REF_SLUG}
        DOCKER_ADDITIONAL_TAG: alpha
        REPOSITORY: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}
  tags:
    - AWS
    - DockerExecutor

trigger_deploy_dev:
  stage: deploy
  image: alpine/curl:latest
  script:
    - - "curl -X POST --fail -F token=$TRIGGER_TOKEN_DEV -F ref=master https://gitlab.deltixhub.com/api/v4/projects/3106/trigger/pipeline"
  only:
    - development
  tags:
    - Linux
    - DockerExecutor

