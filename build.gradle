import org.springframework.boot.gradle.plugin.SpringBootPlugin

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        constraints {
            classpath ('org.apache.commons:commons-lang3:3.20.0') {
                because("previous versions have vulnerabilities")
            }
            classpath ('org.apache.httpcomponents.core5:httpcore5:5.4.3') {
                because("CVE-2026-54399: HTTP/1 header parsing memory-exhaustion denial of service")
            }
            classpath ('org.apache.httpcomponents.core5:httpcore5-h2:5.4.3') {
                because("CVE-2026-54428: HPackDecoder unlimited header list size before SETTINGS ACK")
            }
            classpath ('org.apache.httpcomponents.client5:httpclient5:5.6.3') {
                because("CVE-2026-64607: connection leak on Content-Encoding decode error exhausts the pool")
            }
        }
        // Jackson 3 is pulled in transitively by jOOQ codegen; 3.1.4 and earlier are vulnerable to
        // CVE-2026-59889 (@JsonView bypass for @JsonUnwrapped containers). The BOM keeps the whole
        // Jackson family on one version instead of bumping jackson-databind alone.
        classpath platform('tools.jackson:jackson-bom:3.1.5')
        // Dependencies for the generateJooq task (Zonky + Flyway + jOOQ codegen)
        classpath "io.zonky.test:embedded-postgres:${embedded_postgres_version}"
        classpath "org.flywaydb:flyway-core:${flyway_version}"
        classpath "org.flywaydb:flyway-database-postgresql:${flyway_version}"
        classpath 'org.jooq:jooq-codegen:3.21.6'
        classpath "org.postgresql:postgresql:${pg_version}"
        // Dependencies for the generateClickHouseJooq task (Testcontainers + Flyway CH + CH driver)
        classpath "org.testcontainers:testcontainers:${testcontainers_version}"
        classpath "org.flywaydb:flyway-database-clickhouse:${flyway_clickhouse_version}"
        classpath "com.clickhouse:clickhouse-jdbc:${clickhouse_jdbc_version}"
    }
}

plugins {
    id 'java'
    id 'checkstyle'
    id 'io.freefair.lombok' version '9.5.0'
    id 'org.springframework.boot' version '4.1.1'
    id 'com.diffplug.spotless' version '8.8.0'
}

group = 'com.epam.aidial'
version = "0.1.0-rc"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDirs += file("${projectDir}/src/main/java-generated")
        }
    }
}

compileJava {
    options.warnings = true
    options.deprecation = true
    options.compilerArgs += ['-Xlint:unchecked']
}

compileTestJava {
    options.warnings = true
    options.deprecation = true
    options.compilerArgs += ['-Xlint:unchecked']
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    configureEach {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
    }
    configureEach {
        resolutionStrategy {
            // Pin json-schema-validator to the Jackson 3-native line (3.x); MCP SDK pulls an
            // older Jackson 2 build that is incompatible with the tools.jackson migration
            force 'com.networknt:json-schema-validator:3.0.6'
        }
    }
}

checkstyle {
    toolVersion = "13.7.0"
    configDirectory = file("$rootProject.projectDir/checkstyle")

    configProperties['org.checkstyle.google.suppressionfilter.config'] =
            file("$rootDir/checkstyle/checkstyle-suppressions.xml")
}

spotless {
    java {
        // Format hand-written sources only; never touch jOOQ-generated sources.
        target 'src/*/java/**/*.java'
        targetExclude 'src/main/java-generated/**'

        palantirJavaFormat('2.94.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)

    // Shared execution engine module
    implementation project(':evaluation-runner-core')

    // Core
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // OpenAPI / Swagger (Spring Boot 4 / Spring Framework 7 compatible)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.3'

    // Azure Identity (for Azure auth)
    implementation 'com.azure:azure-identity:1.18.4'

    // Database
    implementation "org.postgresql:postgresql:${pg_version}"
    // ClickHouse V2 JDBC driver (analytics vendor option). Plain artifact; Gradle resolves the
    // transitive Apache HttpClient5 dependency needed for the HTTP-based query interface.
    implementation "com.clickhouse:clickhouse-jdbc:${clickhouse_jdbc_version}"

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // clickhouse-jdbc >= 0.10.0 fixed the ANTLR parser bug that made this plugin's schema-existence
    // probe (SELECT COUNT() FROM system.databases WHERE name = ?) fail to bind on 0.9.0. Flyway now
    // owns ClickHouse schema management the same way it owns Postgres's — see AnalyticsClickHouseConfiguration.
    implementation "org.flywaydb:flyway-database-clickhouse:${flyway_clickhouse_version}"

    implementation 'org.springframework.boot:spring-boot-jooq'
    implementation 'org.jooq:jooq'

    // Logging
    implementation('org.springframework.boot:spring-boot-starter-log4j2') {
        exclude group: 'org.apache.logging.log4j'
    }
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4j_version}"
    implementation "org.apache.logging.log4j:log4j-core:${log4j_version}"
    implementation "org.apache.logging.log4j:log4j-jul:${log4j_version}"
    // Commons Logging (JCL) -> SLF4J bridge. Spring Framework 7 dropped the repackaged spring-jcl
    // and uses the org.apache.commons.logging API directly; without this bridge, Spring Boot's
    // Log4J2LoggingSystem fails with NoClassDefFoundError: org/apache/commons/logging/Log.
    // jcl-over-slf4j provides the org.apache.commons.logging.* API and routes it to SLF4J (Log4j2).
    implementation 'org.slf4j:jcl-over-slf4j'

    // Metrics & Monitoring
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:context-propagation'
    implementation platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.29.0')
    implementation platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.29.0-alpha')
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-log4j-appender-2.17'
    runtimeOnly 'io.grpc:grpc-netty-shaded'  // gRPC transport for OTEL_EXPORTER_OTLP_PROTOCOL=grpc

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.hibernate.validator:hibernate-validator'
    compileOnly 'org.jetbrains:annotations:26.1.0'

    // Schema & OpenAPI utilities
    implementation 'com.networknt:json-schema-validator:3.0.6'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // MCP SDK (Model Context Protocol client)
    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:2.0.0')
    implementation 'io.modelcontextprotocol.sdk:mcp-core'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3'

    // Rate limiting
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.19.0'

    // JSONata expression evaluation
    implementation 'com.dashjoin:jsonata:0.9.10'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation "org.testcontainers:testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-jdbc"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    // NOTE: there is deliberately no "org.testcontainers:clickhouse" module here. That coordinate
    // only exists on the legacy 1.x line (latest 1.21.3) and would drag 1.x copies of
    // testcontainers-jdbc / database-commons onto the classpath next to the Boot-BOM-managed 2.0.5
    // prefixed modules (different GA coordinates, so Gradle cannot align them). ClickHouse is
    // started from a plain GenericContainer in ClickHouseFunctionalTests instead.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "io.zonky.test:embedded-postgres:${embedded_postgres_version}"

    constraints {
        implementation ('com.nimbusds:nimbus-jose-jwt:10.9.1') {
            because("previous versions have vulnerabilities")
        }
        checkstyle ('org.apache.commons:commons-lang3:3.20.0') {
            because("previous versions have vulnerabilities")
        }
        checkstyle ('org.codehaus.plexus:plexus-utils:3.6.1') {
            because("CVE-2025-67030: directory traversal vulnerability in extractFile method")
        }
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // ArchUnit 1.4.x targets JUnit Platform 1.x; its engine is incompatible with JUnit
        // Platform 6 (Spring Boot 4). Architectural rules are enforced via plain @Test +
        // ClassFileImporter so Jupiter discovers and runs them without the ArchUnit engine.
        // The engine is excluded to prevent it from crashing during the discovery phase.
        // When ArchUnit releases JUnit Platform 6 support, revert the arch test classes to
        // @ArchTest/@AnalyzeClasses and remove this exclusion. See: re-enable-archunit-on-junit6.
        excludeEngines 'archunit'
    }
    maxHeapSize = '1g'
    // The forked test JVM does NOT inherit org.gradle.jvmargs from gradle.properties.
    // Netty calls System.loadLibrary, which triggers a JDK 25 restricted-native-access
    // warning unless the (unnamed-module) caller is granted native access explicitly.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += "-Werror"
}


// ---------------------------------------------------------------------------------------------
// jOOQ code generation
//
// The two generated model packages have DIFFERENT sources of truth, on purpose:
//
//   * meta      (com.epam.aidial.evaluation.data.db.jooq.meta)      <- Postgres meta migrations
//   * analytics (com.epam.aidial.evaluation.data.db.jooq.analytics) <- ClickHouse analytics migrations
//
// The analytics data model must be vendor-independent: analytics schema evolution happens in
// src/main/resources/db/migration/analytics/CLICKHOUSE first, and the Postgres analytics
// migrations are the derived twin. Generating the analytics model from ClickHouse makes that
// direction structural rather than a convention. Both vendors are then protected by drift guards:
//   * JooqSchemaDriftTest       - live Postgres analytics schema  vs the generated model (PG twin)
//   * ClickHouseSchemaDriftTest - live ClickHouse analytics schema vs the generated model (source)
//
// Each task pre-cleans only its own subtree of src/main/java-generated, so running one never
// deletes the other's output.
// ---------------------------------------------------------------------------------------------

/**
 * The jOOQ Generate flags shared by both codegen tasks. Index constants are generated for meta
 * only: ClickHouse data-skipping indexes are table-scoped, so the analytics schema legitimately
 * declares the same index name (idx_id) on two tables, which jOOQ would render as two clashing
 * constants in Indexes.java. Nothing reads the generated analytics Indexes/Keys constants.
 */
static org.jooq.meta.jaxb.Generate jooqGenerateFlags(boolean indexes) {
    new org.jooq.meta.jaxb.Generate()
            .withPojos(false)
            .withDaos(false)
            .withInterfaces(false)
            .withTables(true)
            .withKeys(true)
            .withIndexes(indexes)
            .withRecords(true)
}

/**
 * Boots an embedded Postgres (Zonky, no Docker required), applies the Flyway meta migrations,
 * then runs jOOQ codegen to produce the type-safe DSL sources for the meta schema.
 * Output is written to src/main/java-generated/.../jooq/meta and must be committed to version
 * control. CI compiles the committed sources directly — this task is developer-only.
 *
 * <p>The analytics model is NOT generated here — see generateClickHouseJooq.
 */
tasks.register('generateJooq') {
    group = 'build'
    description = 'Generate jOOQ DSL classes for the META schema from live Flyway-migrated Postgres (Zonky; no Docker).'
    outputs.dir(file("${projectDir}/src/main/java-generated/com/epam/aidial/evaluation/data/db/jooq/meta"))

    doLast {
        def outputDir = file("${projectDir}/src/main/java-generated/com/epam/aidial/evaluation/data/db/jooq/meta")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        def pg = io.zonky.test.db.postgres.embedded.EmbeddedPostgres.start()
        try {
            def jdbcUrl = pg.getJdbcUrl("postgres", "postgres")
            def user = "postgres"
            def password = ""

            org.flywaydb.core.Flyway.configure()
                    .dataSource(jdbcUrl, user, password)
                    .locations("filesystem:${projectDir}/src/main/resources/db/migration/meta/POSTGRES")
                    .defaultSchema("meta")
                    .createSchemas(true)
                    .validateMigrationNaming(true)
                    .load()
                    .migrate()

            org.jooq.codegen.GenerationTool.generate(
                    new org.jooq.meta.jaxb.Configuration()
                            .withLogging(org.jooq.meta.jaxb.Logging.WARN)
                            .withJdbc(new org.jooq.meta.jaxb.Jdbc()
                                    .withUrl(jdbcUrl)
                                    .withUser(user)
                                    .withPassword(password))
                            .withGenerator(new org.jooq.meta.jaxb.Generator()
                                    .withDatabase(new org.jooq.meta.jaxb.Database()
                                            .withName("org.jooq.meta.postgres.PostgresDatabase")
                                            .withInputSchema("meta")
                                            .withExcludes("flyway_schema_history")
                                            .withIncludes(".*"))
                                    .withGenerate(jooqGenerateFlags(true))
                                    .withTarget(new org.jooq.meta.jaxb.Target()
                                            .withPackageName("com.epam.aidial.evaluation.data.db.jooq.meta")
                                            .withDirectory("${projectDir}/src/main/java-generated"))))
        } finally {
            pg.close()
        }
    }
}

/**
 * Starts a ClickHouse container (Docker required), applies the Flyway CLICKHOUSE analytics
 * migrations, then runs jOOQ codegen against the live ClickHouse schema to produce the analytics
 * model. Output is written to src/main/java-generated/.../jooq/analytics and must be committed.
 *
 * <p>The generated Java surface has to stay identical to what the two runtime vendors expect, so
 * codegen configuration bridges the gaps between ClickHouse's type system and the model:
 * <ul>
 *   <li>outputSchema "analytics" — the generated schema class name is imported across the code
 *       base; all runtime DSLContexts use withRenderSchema(false), so it never reaches SQL.</li>
 *   <li>forcedTypes — ClickHouse String columns carry no length and no JSON marker, so id columns
 *       are forced to VARCHAR(36) (JooqTableSchemaResolver infers "uuid" from length 36), JSON
 *       payload columns to JSONB (Field&lt;JSONB&gt; consumers + object/array inference), and the
 *       remaining bounded strings to their Postgres-twin lengths.</li>
 *   <li>keys — ClickHouse reports each table's ORDER BY key as its PRIMARY key, which is enough to
 *       keep the generated records on UpdatableRecordImpl (no synthetic keys needed). The key
 *       columns differ from the Postgres twin's, which is harmless: no production or test code
 *       reads the generated analytics Keys constants, and every upsert lists conflict columns
 *       explicitly.</li>
 * </ul>
 */
tasks.register('generateClickHouseJooq') {
    group = 'build'
    description = 'Generate jOOQ DSL classes for the ANALYTICS schema from live Flyway-migrated ClickHouse (Docker).'
    outputs.dir(file("${projectDir}/src/main/java-generated/com/epam/aidial/evaluation/data/db/jooq/analytics"))

    doLast {
        def outputDir = file("${projectDir}/src/main/java-generated/com/epam/aidial/evaluation/data/db/jooq/analytics")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        def database = "evaluation_analytics"
        def user = "clickhouse"
        def password = "clickhouse"
        def httpPort = 8123

        def clickhouse = new org.testcontainers.containers.GenericContainer("clickhouse/clickhouse-server:25.8")
                .withEnv("CLICKHOUSE_DB", database)
                .withEnv("CLICKHOUSE_USER", user)
                .withEnv("CLICKHOUSE_PASSWORD", password)
                .withExposedPorts(httpPort)
                .waitingFor(org.testcontainers.containers.wait.strategy.Wait.forHttp("/ping")
                        .forPort(httpPort)
                        .forStatusCode(200))
                .withStartupTimeout(java.time.Duration.ofMinutes(3))
        clickhouse.start()
        try {
            // flyway-database-clickhouse only recognises the "jdbc:clickhouse:" prefix, not the
            // driver's shorter "jdbc:ch:" alias (see AnalyticsClickHouseConfiguration).
            def jdbcUrl = "jdbc:clickhouse://${clickhouse.host}:${clickhouse.getMappedPort(httpPort)}/${database}"

            org.flywaydb.core.Flyway.configure()
                    .dataSource(jdbcUrl, user, password)
                    .locations("filesystem:${projectDir}/src/main/resources/db/migration/analytics/CLICKHOUSE")
                    .defaultSchema(database)
                    .createSchemas(true)
                    .validateMigrationNaming(true)
                    .load()
                    .migrate()

            org.jooq.codegen.GenerationTool.generate(
                    new org.jooq.meta.jaxb.Configuration()
                            .withLogging(org.jooq.meta.jaxb.Logging.WARN)
                            .withJdbc(new org.jooq.meta.jaxb.Jdbc()
                                    .withUrl(jdbcUrl)
                                    .withUser(user)
                                    .withPassword(password))
                            .withGenerator(new org.jooq.meta.jaxb.Generator()
                                    .withDatabase(new org.jooq.meta.jaxb.Database()
                                            .withName("org.jooq.meta.clickhouse.ClickHouseDatabase")
                                            .withInputSchema(database)
                                            .withOutputSchema("analytics")
                                            .withExcludes("flyway_schema_history")
                                            .withIncludes(".*")
                                            .withForcedTypes(analyticsForcedTypes()))
                                    .withGenerate(jooqGenerateFlags(false))
                                    .withTarget(new org.jooq.meta.jaxb.Target()
                                            .withPackageName("com.epam.aidial.evaluation.data.db.jooq.analytics")
                                            .withDirectory("${projectDir}/src/main/java-generated"))))
        } finally {
            clickhouse.stop()
        }
    }
}

/**
 * Forced types that reproduce the analytics model's Java/jOOQ surface on top of ClickHouse's
 * type metadata. Each entry lists fully-qualified column names (schema.table.column) as a regex.
 */
static List<org.jooq.meta.jaxb.ForcedType> analyticsForcedTypes() {
    def forced = { String type, String... columns ->
        new org.jooq.meta.jaxb.ForcedType()
                .withName(type)
                .withIncludeExpression(".*\\.(" + columns.join("|") + ")")
                .withIncludeTypes(".*")
    }

    [
            // VARCHAR(36): every id-ish column. The length is load-bearing —
            // JooqTableSchemaResolver infers the "uuid" query-schema type from length() == 36.
            forced("VARCHAR(36)",
                    "test_case_run_results\\.(id|test_suite_run_id|test_suite_id|test_case_id)",
                    "test_case_eval_summaries\\.(id|test_suite_id|test_suite_run_id|test_case_run_result_id|test_case_id|computation_id)",
                    "run_metric_snapshots\\.(id|computation_id|test_suite_run_id|tsmd_id|metric_declaration_id|metric_declaration_version_id)",
                    "metric_score_result\\.(id|test_suite_run_id|computation_id|test_suite_id)"),
            // JSONB: JSON payload columns, stored as ClickHouse String (see the CLICKHOUSE
            // migration's header for why the native JSON type is deliberately not used).
            // Field<JSONB> is what FilterWhitelists / JsonPathAccessor and the object/array
            // inference in JooqTableSchemaResolver consume.
            forced("JSONB",
                    "test_case_run_results\\.(test_case_data|request_body|response_body|log_details|extracted_columns|extraction_warnings)",
                    "test_case_eval_summaries\\.(test_case_data|extracted_columns|metric_values|metric_infos|extraction_warnings)",
                    "run_metric_snapshots\\.(config_bindings|input_bindings|output_schema)"),
            // Bounded strings, matching the Postgres twin's column widths.
            forced("VARCHAR(255)",
                    "test_case_run_results\\.test_case_name",
                    "test_case_eval_summaries\\.test_case_name",
                    "run_metric_snapshots\\.tsmd_name",
                    "metric_score_result\\.(metric_score_name|metric_name)"),
            forced("VARCHAR(20)",
                    "test_case_run_results\\.execution_status",
                    "test_case_eval_summaries\\.execution_status"),
            forced("VARCHAR(128)", "test_case_run_results\\.trace_id"),
    ]
}
