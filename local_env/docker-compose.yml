services:
  postgres:
    image: postgres:17.5
    container_name: evaluation-postgres
    environment:
      POSTGRES_DB: evaluation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evaluation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: evaluation-clickhouse
    environment:
      CLICKHOUSE_DB: evaluation_analytics
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user clickhouse --password clickhouse --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: evaluation-app
    depends_on:
      postgres:
        condition: service_healthy
      # Uncomment when flipping the app to the ClickHouse analytics vendor below.
      # clickhouse:
      #   condition: service_healthy
    environment:
      # Meta datasource
      POSTGRES_META_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evaluation_db
      POSTGRES_META_DATASOURCE_USERNAME: postgres
      POSTGRES_META_DATASOURCE_PASSWORD: postgres
      # Analytics datasource
      POSTGRES_ANALYTICS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evaluation_analytics_db
      POSTGRES_ANALYTICS_DATASOURCE_USERNAME: postgres
      POSTGRES_ANALYTICS_DATASOURCE_PASSWORD: postgres
      CONFIG_REST_SECURITY_MODE: none
      METRIC_PROVIDERS_SYNC_ENABLED: ${METRIC_PROVIDERS_SYNC_ENABLED:-false}
      METRIC_PROVIDERS_DIAL_BASE_URL: ${METRIC_PROVIDERS_DIAL_BASE_URL}
      METRIC_PROVIDERS_DIAL_ENABLED: ${METRIC_PROVIDERS_DIAL_ENABLED:-true}
      # Optional second metric provider (stock `extra` entry, disabled by default)
      METRIC_PROVIDERS_EXTRA_ENABLED: ${METRIC_PROVIDERS_EXTRA_ENABLED:-false}
      METRIC_PROVIDERS_EXTRA_BASE_URL: ${METRIC_PROVIDERS_EXTRA_BASE_URL:-http://localhost:8087}
      METRIC_PROVIDERS_SYNC_CRON: ${METRIC_PROVIDERS_SYNC_CRON}
      DIAL_EF_API_KEY: ${DIAL_EF_API_KEY}
      # To run analytics on ClickHouse instead of Postgres:
      # DATASOURCE_ANALYTICS_VENDOR: CLICKHOUSE
      # CLICKHOUSE_ANALYTICS_DATASOURCE_URL: jdbc:ch://clickhouse:8123/evaluation_analytics
      # CLICKHOUSE_ANALYTICS_DATASOURCE_USERNAME: clickhouse
      # CLICKHOUSE_ANALYTICS_DATASOURCE_PASSWORD: clickhouse
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro

volumes:
  postgres_data:
  clickhouse_data:
